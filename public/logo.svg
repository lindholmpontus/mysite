<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="planet" cx="40%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#dff0ff" />
      <stop offset="50%" stop-color="#5b9dff" />
      <stop offset="100%" stop-color="#243a73" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070d" />
  <!-- ring behind the planet -->
  <ellipse cx="32" cy="32" rx="27" ry="8.5" fill="none" stroke="#9fc1ff" stroke-width="2.4" opacity="0.55"
           transform="rotate(-20 32 32)" />
  <!-- planet -->
  <circle cx="32" cy="32" r="12.5" fill="url(#planet)" />
  <!-- ring front (over the planet's lower half) -->
  <path d="M 8.7 38.2 A 27 8.5 -20 0 0 55.3 25.8" fill="none" stroke="#dce9ff" stroke-width="2.4"
        stroke-linecap="round" opacity="0.95" />
</svg>
